[package]
name = "soloist_history"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The played history of a Spotify Soloist device, for spotify_player"
publish = false

[[bin]]
name = "soloist-history"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3.18"
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true
